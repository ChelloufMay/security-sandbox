worker_processes  1;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream backend_up {
    # backend service inside Docker network
    server backend:8000;
  }

  upstream frontend_up {
    # Vite dev server running on the Windows host (host.docker.internal)
    server host.docker.internal:5173;
  }

  server {
    listen 443 ssl;
    server_name security-sandbox.test;

    ssl_certificate     /etc/ssl/certs/security-sandbox.test.pem;
    ssl_certificate_key /etc/ssl/certs/security-sandbox.test-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # proxy for API/backend (assumes your API paths start with /api/ or /admin/)
    location /api/ {
      proxy_pass http://backend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # any paths for admin or static admin pages
    location /admin/ {
      proxy_pass http://backend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    # everything else -> frontend dev server (Vite)
    location / {
      proxy_pass http://frontend_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # optional: redirect http to https
  server {
    listen 80;
    server_name security-sandbox.test;
    return 301 https://$host$request_uri;
  }
}
